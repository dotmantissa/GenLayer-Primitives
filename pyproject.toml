[project]
name = "sla-enforcement-oracle"
version = "1.0.0"
description = "SLA Enforcement Oracle -- GenLayer primitive for on-chain SLA adjudication"
requires-python = ">=3.11"

[project.dependencies]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -p no:gltest"
markers = ["integration: explicitly enabled live GenLayer network tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"
